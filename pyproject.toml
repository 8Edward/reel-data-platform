[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reel"
version = "0.1.0"
description = "MovieLens + TMDB data platform: loaders, Airflow, dbt, ClickHouse"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Eduard Dunaev"}]
dependencies = ["psycopg[binary]>=3.2", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
